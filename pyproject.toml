[project]
name = "git-class-render"
version = "0.2.1"
description = "Catálogo de livros para praticar branches de ambiente (DEV, QA, PRD) no Render."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
